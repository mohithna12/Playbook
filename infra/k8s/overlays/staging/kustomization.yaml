apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Staging: single replica for API, minimal resources
  - target:
      kind: Deployment
      name: fantasyai-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: staging

  # Staging: single worker
  - target:
      kind: Deployment
      name: fantasyai-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: staging

  # Staging: single pgbouncer
  - target:
      kind: Deployment
      name: fantasyai-pgbouncer
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # Staging: lower HPA limits
  - target:
      kind: HorizontalPodAutoscaler
      name: fantasyai-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
