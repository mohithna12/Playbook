apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Production uses base values as-is (2 API replicas, full resources).
# Only override environment label.
patches:
  - target:
      kind: Deployment
      name: fantasyai-api
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: production

  - target:
      kind: Deployment
      name: fantasyai-worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: production
