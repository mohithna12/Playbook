apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    # pgbouncer
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pgbouncer
      ports:
        - port: 6432
          protocol: TCP
    # Redis
    - ports:
        - port: 6379
          protocol: TCP
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS outbound (Sleeper API, LLM API, S3)
    - ports:
        - port: 443
          protocol: TCP
---
