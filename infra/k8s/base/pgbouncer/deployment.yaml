apiVersion: apps/v1
kind: Deployment
metadata:
  name: fantasyai-pgbouncer
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: database-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          image: bitnami/pgbouncer:1
          ports:
            - containerPort: 6432
              name: pgbouncer
          envFrom:
            - secretRef:
                name: fantasyai-secrets
          env:
            - name: PGBOUNCER_DATABASE
              value: fantasyai
            - name: PGBOUNCER_POOL_MODE
              value: transaction
            - name: PGBOUNCER_DEFAULT_POOL_SIZE
              value: "15"
            - name: PGBOUNCER_MAX_CLIENT_CONN
              value: "200"
            - name: PGBOUNCER_SERVER_TLS_SSLMODE
              value: require
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /bitnami/pgbouncer/conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
