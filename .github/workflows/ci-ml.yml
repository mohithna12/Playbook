name: CI -- ML Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "app/ml/**"
      - "app/sim/**"
      - "tests/ml/**"

concurrency:
  group: ci-ml-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  ml-smoke-test:
    name: ML Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run ML smoke test
        run: |
          uv run pytest tests/ml/test_training_smoke.py \
            tests/ml/test_backtest.py \
            -v --timeout=600

      - name: Check feature-set version consistency
        run: uv run pytest tests/unit/test_feature_builder.py -v -k "version"
