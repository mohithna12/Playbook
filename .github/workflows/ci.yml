name: CI

# Both triggers matter: work lands directly on main here, so a
# pull_request-only trigger means CI never actually runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ===========================================================================
  # Python: Lint, Typecheck, Import Rules
  # ===========================================================================
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Ruff check
        run: uv run ruff check app/ tests/ airflow/ scripts/

      - name: Ruff format check
        run: uv run ruff format --check app/ tests/ airflow/ scripts/

      - name: mypy
        run: uv run mypy app/

      - name: import-linter
        run: uv run lint-imports

  # ===========================================================================
  # Python: Unit Tests + Coverage
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            -v

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ===========================================================================
  # Python: Integration Tests (Postgres + Redis via testcontainers)
  # ===========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v

  # ===========================================================================
  # Contract Tests (OpenAPI + Schemathesis)
  # ===========================================================================
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run contract tests
        run: uv run pytest tests/contract/ -v -p schemathesis

  # ===========================================================================
  # OpenAPI Diff Check
  # ===========================================================================
  openapi-diff:
    name: OpenAPI Diff
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Generate OpenAPI spec
        run: uv run scripts/generate_openapi.py

      - name: Check for uncommitted spec changes
        run: |
          if ! git diff --quiet openapi/spec.json; then
            echo "::error::OpenAPI spec has changed but was not committed. Run 'make openapi' and commit."
            git diff openapi/spec.json
            exit 1
          fi

  # ===========================================================================
  # Frontend: Lint, Typecheck, Tests
  # ===========================================================================
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # The frontend is scaffolding until M15: package.json exists, a lockfile
      # does not, so setup-node's cache lookup and `npm ci` both fail. The
      # guard is a step rather than a job-level `if` because hashFiles() needs
      # a checked-out workspace -- at job level it is a workflow validation
      # error, and the whole file fails to parse.
      - name: Check for a lockfile
        id: lockfile
        working-directory: .
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend/package-lock.json; skipping frontend checks until the app is built (M15)."
          fi

      - uses: actions/setup-node@v4
        if: steps.lockfile.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.lockfile.outputs.present == 'true'
        run: npm ci

      - name: ESLint
        if: steps.lockfile.outputs.present == 'true'
        run: npm run lint

      - name: Prettier check
        if: steps.lockfile.outputs.present == 'true'
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: TypeScript check
        if: steps.lockfile.outputs.present == 'true'
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

  # ===========================================================================
  # Docker: Build + Trivy Scan
  # ===========================================================================
  build-images:
    name: Build & Scan Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        image:
          - { name: api, file: docker/Dockerfile.api }
          - { name: worker, file: docker/Dockerfile.worker }
          - { name: ml, file: docker/Dockerfile.ml }
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f ${{ matrix.image.file }} -t playbook-${{ matrix.image.name }}:ci .

      - name: Trivy scan
        # Pinned, not @master: a moving ref means a third party can break this
        # repo's CI without anything here changing, which is what happened.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: playbook-${{ matrix.image.name }}:ci
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ===========================================================================
  # Kubernetes: Validate Manifests
  # ===========================================================================
  k8s-validate:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          find infra/k8s/ -name '*.yaml' -not -name 'values.yaml' -not -name 'kustomization.yaml' | \
            xargs kubeconform -strict -ignore-missing-schemas -summary
