[project]
name = "playbook"
version = "0.1.0"
description = "ML-backed fantasy football decision copilot"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    # Direct floor on a transitive dep: fastapi's own range still permits the
    # vulnerable starlette, and CVE-2026-48818 (SSRF / NTLM credential theft
    # via UNC paths) is fixed in 1.1.0.
    "starlette>=1.1.0",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "orjson>=3.10,<4",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    # Redis
    "redis[hiredis]>=5.2,<6",
    # Auth
    "pyjwt[crypto]>=2.9,<3",
    "httpx>=0.28,<1",
    # Job queue
    "arq>=0.26,<1",
    # Optimization
    "pulp>=2.9,<3",
    # Telemetry
    "opentelemetry-api>=1.28,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-instrumentation-fastapi>=0.49b,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b,<1",
    "opentelemetry-instrumentation-redis>=0.49b,<1",
    "opentelemetry-instrumentation-httpx>=0.49b,<1",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
    # prometheus-fastapi-instrumentator is deliberately absent. It is not
    # imported anywhere yet (it is for M17 observability) and its <8 range
    # caps starlette below 1.0, which pins us to a starlette carrying
    # CVE-2026-48818. Add it back at M17 at whatever version tracks the
    # starlette in use then.
    # Logging
    "structlog>=24,<25",
    # AWS
    "boto3>=1.35,<2",
    # Utilities
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
worker = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "anthropic>=0.40,<1",
]
ml = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "xgboost>=2.1,<3",
    "scikit-learn>=1.5,<2",
    "shap>=0.46,<1",
    # Floor numba explicitly. shap pulls it in transitively, and without a
    # floor the resolver backtracks to numba 0.53 (2021) to satisfy our numpy
    # range -- which pins llvmlite 0.36, a version that cannot build on any
    # Python we support. The failure surfaces as an llvmlite build error with
    # no mention of numba.
    "numba>=0.61",
    "optuna>=4,<5",
    # >=23.0.1 for CVE-2026-25087 (HIGH); the previous <19 cap sat below the
    # fix, so the ml image failed its Trivy scan.
    "pyarrow>=23.0.1",
]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6,<7",
    "pytest-benchmark>=5,<6",
    "hypothesis>=6.115,<7",
    "testcontainers[postgres,redis]>=4,<5",
    "schemathesis>=4.24.3,<5",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "import-linter>=2.13,<3",
    "pre-commit>=4,<5",
    "types-redis>=4,<5",
    "sqlalchemy[mypy]>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# =============================================================================
# Ruff -- linter + formatter (replaces black, isort, flake8, pyupgrade)
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "airflow", "scripts"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "T20",   # flake8-print (no prints in production code)
    "DTZ",   # flake8-datetimez (timezone-aware datetimes)
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "FLY",   # flynt (f-string conversion)
    "PERF",  # perflint
]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # allow Depends() in function args (FastAPI pattern)
]

[tool.ruff.lint.per-file-ignores]
# allow assert, hardcoded passwords, print, and private access in tests; TC*
# because test apps and fixtures resolve their annotations at runtime too.
"tests/**" = ["S101", "S105", "S106", "T20", "SLF001", "TC001", "TC002", "TC003"]
"scripts/**" = ["T20"]                   # allow print in scripts
"airflow/**" = ["T20"]                   # allow print in DAGs
# SQLAlchemy resolves Mapped[...] annotations at class-creation time, so the
# types named inside them must be importable at runtime. Hoisting them into a
# TYPE_CHECKING block raises MappedAnnotationError on import.
"app/models/**" = ["TC001", "TC002", "TC003"]
# Same reason, different framework: FastAPI resolves handler and dependency
# annotations at runtime to build the signature it injects against.
"app/api/**" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["app.models.base.Base", "pydantic.BaseModel"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# mypy -- strict type checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "arq.*",
    "pulp.*",
    "shap.*",
    "optuna.*",
    "xgboost.*",
    "great_expectations.*",
    "testcontainers.*",
    "schemathesis.*",
]
ignore_missing_imports = true

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no I/O)",
    "integration: Integration tests (requires Postgres + Redis)",
    "contract: Contract tests (may hit live APIs)",
    "ml: ML pipeline tests (slow)",
    "benchmark: Performance benchmarks",
]
addopts = [
    "-ra",               # show summary of all non-passing tests
    "--strict-markers",  # fail on unknown markers
    "-q",                # quiet output
    "-p", "no:schemathesis",  # disable schemathesis plugin globally (run explicitly in contract tests)
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# =============================================================================
# coverage
# =============================================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "app/core/config.py",
    # Declaration, not logic: ARQ reads these class attributes to build a
    # worker. Same category as core/config.py above. The code they point at
    # (run_job, reap) is covered by the integration suite.
    "app/workers/config.py",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
]

# =============================================================================
# import-linter -- enforce module dependency rules
# =============================================================================
[tool.importlinter]
root_packages = ["app"]
# Required because the domain/sim contracts forbid external packages
# (sqlalchemy, asyncpg, redis, httpx, boto3), not just internal modules.
include_external_packages = true

[[tool.importlinter.contracts]]
# Three layers, not "app.api" over "app.services | app.schemas": siblings on a
# shared layer must be independent of each other, which would forbid a service
# from returning a schema object -- the natural way for a service to hand a
# result to a router without the router reaching past it.
name = "API depends on services, services depend on schemas"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.schemas",
]

[[tool.importlinter.contracts]]
# Routers hold no ORM entities and build no queries; they call services. The
# transitive path api -> services -> repositories -> models is the intended
# one, so only direct imports are forbidden.
name = "API layer does not touch ORM models or repositories directly"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = [
    "app.models",
    "app.repositories",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain has no I/O dependencies"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.models",
    "app.repositories",
    "app.services",
    "app.api",
    "app.workers",
    "sqlalchemy",
    "asyncpg",
    "redis",
    "httpx",
    "boto3",
]

[[tool.importlinter.contracts]]
name = "Simulation engine depends only on numpy/scipy"
type = "forbidden"
source_modules = ["app.sim"]
forbidden_modules = [
    "app.models",
    "app.repositories",
    "app.services",
    "app.api",
    "app.workers",
    "sqlalchemy",
    "asyncpg",
    "redis",
    "httpx",
    "boto3",
]

[[tool.importlinter.contracts]]
name = "Repositories do not depend on services or API"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = [
    "app.services",
    "app.api",
    "app.workers",
]
